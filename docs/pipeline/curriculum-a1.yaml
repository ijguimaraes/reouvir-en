# Currículo do nível A1 (rascunho para validação pedagógica).
#
# É independente de contexto: o mesmo arquivo serve a todos os contextos
# (entrevista, viagem, etc.). `level.code`, `topic.slug`, `topic.name` e
# `topic.order` vão direto para o JSON de importação (docs/estrutura-do-projeto.md, seção 8).
# O `slug` do tópico é único em todo o catálogo, não só neste nível.
#
# Lógica de gramática:
#   permitido(tópico N) = baseline + introduces dos tópicos 1..N
#   proibido(tópico N)  = tudo o que não está em "permitido" (o `forbids` abaixo só
#                         explicita o que costuma escapar e o que o prompt deve repetir).
# `soft` = tolerado, mas com teto de frases (ratio) por playlist.

schema_version: 1

# Catálogo de recursos gramaticais. O validador (spaCy) detecta cada `id` na frase.
features:
  pron_subject:     { detect: "token.tag_ == 'PRP' and token.dep_ == 'nsubj'; I/you/he/she/it/we/they" }
  be_present:       { detect: "lemma 'be' em VBZ/VBP (am/is/are/'m/'s/'re), sem neg e sem inversão" }
  be_negative:      { detect: "lemma 'be' com filho dep_ == 'neg' (isn't, am not)" }
  be_question:      { detect: "frase termina em '?' e o 'be' vem antes do sujeito" }
  art_indefinite:   { detect: "lower in {a, an} com pos_ == 'DET'" }
  art_definite:     { detect: "lower == 'the'" }
  noun_plural:      { detect: "tag_ in {NNS, NNPS}" }
  demonstrative:    { detect: "lower in {this, that, these, those}" }
  poss_adj:         { detect: "tag_ == 'PRP$' (my, your, his, her, its, our, their)" }
  there_be:         { detect: "token com dep_ == 'expl' e lower == 'there'" }
  have_got:         { detect: "lemma 'have' + 'got', ou 'have/has' como verbo principal" }
  present_simple:   { detect: "VBZ/VBP cujo lemma não é 'be' nem 'have'" }
  past:             { detect: "tag_ in {VBD, VBN}" }
  modal:            { detect: "tag_ == 'MD'" }
  future:           { detect: "'will' ou 'going to'" }

# Este arquivo é agnóstico a contextos: só gramática e nível. Cenas, vocabulário temático
# e exemplos específicos vêm do arquivo do contexto (contexts/*.yaml). Os exemplos
# `good`/`bad` abaixo são neutros, do dia a dia, para não puxar o gerador para um tema.
#
# Sempre permitido em A1 (não conta como "gramática nova").
baseline:
  - nomes próprios (pessoas, cidades, marcas)
  - adjetivos da lista A1 (tired, ready, late, happy...)
  - preposições in, at, on, from, with
  - conjunções and, but
  - advérbios very, here, now, today
  - números por extenso até 10
  - contrações (I'm, she's, isn't, aren't...) desde o tópico 1; o TTS as lê melhor

level:
  code: A1
  name: A1
  order: 1
  sentence_words: { min: 4, max: 10 }   # alinhado à seção 8.3 do documento
  playlist_size: 100                    # alvo final
  candidates: 130                       # gerados para sobrar após filtros

topics:
  - slug: pronomes-e-verbo-to-be
    name: Pronomes pessoais e verbo to be (afirmativo)
    order: 1
    introduces: [pron_subject, be_present]
    forbids: [be_negative, be_question, art_indefinite, art_definite, noun_plural, demonstrative, poss_adj, there_be, have_got, present_simple, past, modal, future]
    predicates: "adjetivo, lugar (in/at/from + nome próprio) ou nome próprio"
    good:
      - "I am ready."
      - "She's tired today."
      - "We're in London."
      - "Maria is at home."
    bad:
      - { text: "I am a teacher.", why: "a/an é do tópico 3" }
      - { text: "We are teachers.", why: "plural é do tópico 4; profissões só no singular, com a/an" }
      - { text: "He is my brother.", why: "possessivo é do tópico 2" }
      - { text: "Are you ready?", why: "pergunta é do tópico 2" }

  - slug: to-be-negativo-perguntas-e-possessivos
    name: Verbo to be (negativo e perguntas) e possessivos
    order: 2
    introduces: [be_negative, be_question, poss_adj]
    forbids: [art_indefinite, art_definite, noun_plural, demonstrative, there_be, have_got, present_simple, past, modal, future]
    good:
      - "I am not late."
      - "Are you ready?"
      - "Is she at home?"
      - "No, we aren't tired."
      - "What is your name?"
      - "My name is Ana."

  - slug: artigo-a-an
    name: Artigos a e an
    order: 3
    introduces: [art_indefinite]
    forbids: [art_definite, noun_plural, demonstrative, there_be, have_got, present_simple, past, modal, future]
    good:
      - "I am a teacher."
      - "She is an actor."
      - "It is an apple."
    bad:
      - { text: "I am a teacher at the school.", why: "the é do tópico 5" }

  - slug: plural-e-demonstrativos
    name: Plural e this / that / these / those
    order: 4
    introduces: [noun_plural, demonstrative]
    forbids: [art_definite, there_be, have_got, present_simple, past, modal, future]
    good:
      - "These are good questions."
      - "That is a good idea."

  - slug: artigo-the
    name: Artigo the
    order: 5
    introduces: [art_definite]
    forbids: [there_be, have_got, present_simple, past, modal, future]
    good:
      - "The park is in London."
      - "Is the door open?"

  - slug: there-is-there-are
    name: There is / there are
    order: 6
    introduces: [there_be]
    forbids: [have_got, present_simple, past, modal, future]

  - slug: have-got
    name: Have got
    order: 7
    introduces: [have_got]
    forbids: [present_simple, past, modal, future]

  - slug: presente-simples
    name: Presente simples
    order: 8
    introduces: [present_simple]
    forbids: [past, modal, future]

# Decisões pedagógicas já tomadas (pelo professor):
decisions:
  - "Profissões só no singular (com a/an, tópico 3); sem plural no tópico 1."
  - "Possessivos antecipados para o tópico 2 (My name is..., What is your name?)."
  - "Contrações permitidas desde o tópico 1."
  - "Presente simples depois de there is/are e have got (tópico 8)."

# A validar com English Grammar Profile (Cambridge) / CEFR-J:
open_questions:
  - "Conferir a ordem completa com as duas fontes antes de gerar em escala."
